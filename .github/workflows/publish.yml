name: Publish

# npm trusted publishing (OIDC) is configured for this file name: keep the
# publish job in publish.yml, and do not call it from another workflow.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (on 0.x, a breaking change is a minor; the pre* bumps publish a prerelease on the `next` npm tag)'
        type: choice
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]
        default: patch
      preid:
        description: 'Prerelease identifier, used by the pre* bumps only'
        type: choice
        options: [alpha, beta, rc]
        default: alpha

concurrency: publish

jobs:
  test:
    name: Test
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build all packages
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Test
        run: npm run test:ci

  release:
    name: Bump version and changelog
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      body: ${{ steps.changelog.outputs.changed == 'true' && steps.changelog.outputs.body || format('Stable release of {0}.', steps.version.outputs.previous) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The changelog action reads the commit that added each fragment.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Bumps the root and every workspace to the same version, and updates
      # their versions in package-lock.json.
      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
        run: |
          PREVIOUS=$(node -p 'require("./package.json").version')
          npm version "$BUMP" --preid "$PREID" --workspaces --include-workspace-root --no-git-tag-version
          VERSION=$(node -p 'require("./package.json").version')
          # A prerelease (e.g. 1.2.0-beta.0) goes to the `next` dist-tag.
          if [[ $VERSION == *-* ]]; then
            PRERELEASE=true
            DIST_TAG=next
          else
            PRERELEASE=false
            DIST_TAG=latest
          fi
          # A stable version after a prerelease (1.0.0-rc.1 -> 1.0.0) promotes it.
          if [[ $PREVIOUS == *-* && $PRERELEASE == false ]]; then
            PROMOTION=true
          else
            PROMOTION=false
          fi
          {
            echo "previous=$PREVIOUS"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "dist-tag=$DIST_TAG"
            echo "promotion=$PROMOTION"
          } >> "$GITHUB_OUTPUT"

      - name: Fold changelog fragments
        id: changelog
        uses: weareikko/changelog@c25888e03ad7c8bbaee897b84e778ebce9e9301c # 1.0.3
        with:
          command: release
          version: v${{ steps.version.outputs.version }}

      # Promoting a prerelease can have no fragment: the changelog gets no new
      # section and the GitHub release says it is the stable release.
      - name: Fail when there is nothing to release
        if: steps.changelog.outputs.changed != 'true' && steps.version.outputs.promotion != 'true'
        run: |
          echo "::error::No fragment in .changelog/: nothing to release."
          exit 1

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .changelog package.json package-lock.json packages/*/package.json
          git commit -m "v$VERSION"
          git tag "$VERSION"
          git push origin HEAD:main "$VERSION"

  # A tag pushed with GITHUB_TOKEN does not start other workflows, so the
  # publish job runs in this workflow, on the tag the release job created.
  publish:
    name: Publish to npm
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Copy README
        run: cp README.md packages/playground/

      # The action skips a version that npm already has, so "Re-run failed jobs"
      # publishes only the packages that are missing. It authenticates with
      # trusted publishing (OIDC, no npm token) and runs `npm publish
      # --ignore-scripts`: the steps above build the published files.
      - name: Publish @studiometa/playground
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/playground
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}

      - name: Publish @studiometa/playground-preview
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/playground-preview
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.release.outputs.version }}
          name: ${{ needs.release.outputs.version }}
          body: ${{ needs.release.outputs.body }}
          draft: false
          prerelease: ${{ needs.release.outputs.prerelease }}
          makeLatest: ${{ needs.release.outputs.prerelease != 'true' }}
