name: Publish

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: |
          npm run build
          npm run build -w @studiometa/playground-preview

      - name: Run tests
        run: npm test

      - name: Copy README
        run: cp README.md packages/playground/

      - name: Publish @studiometa/playground
        run: npm publish -w @studiometa/playground --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @studiometa/playground-preview
        run: npm publish -w @studiometa/playground-preview --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
